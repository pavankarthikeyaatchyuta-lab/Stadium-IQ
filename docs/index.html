<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="StadiumIQ — Operational Intelligence Platform for FIFA World Cup 2026. A premium dashboard for managing stadium operations, crowd safety, and fan navigation.">
  <title>StadiumIQ | FIFA World Cup 2026</title>
  <style>
@import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap');

:root {
  --bg: #030712;
  --surface: rgba(17, 24, 39, 0.7);
  --accent: #10b981;
  --accent-glow: rgba(16, 185, 129, 0.5);
  --danger: #ef4444;
  --warning: #f59e0b;
  --text: #f9fafb;
  --text-muted: #9ca3af;
  --border: rgba(255, 255, 255, 0.12);
}

* { box-sizing: border-box; margin: 0; padding: 0; }

@keyframes gradientBg {
  0% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}

body {
  background: linear-gradient(-45deg, #0f172a, #020617, #064e3b, #020617);
  background-size: 400% 400%;
  animation: gradientBg 15s ease infinite;
  color: var(--text);
  font-family: 'Outfit', sans-serif;
  letter-spacing: 0.2px;
  line-height: 1.6;
  min-height: 100vh;
}

.container { max-width: 1200px; margin: 0 auto; padding: 2rem 1.5rem; }

header {
  display: flex; justify-content: space-between; align-items: flex-end;
  padding-bottom: 1.5rem; margin-bottom: 2rem; border-bottom: 1px solid var(--border);
}

header h1 {
  font-size: 2.8rem; font-weight: 800;
  background: linear-gradient(135deg, #34d399, #3b82f6);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  text-shadow: 0 0 30px rgba(52,211,153,0.3);
  letter-spacing: -1px;
}
header p { color: var(--text-muted); font-size: 1rem; font-weight: 300; }

.hidden { display: none !important; }
.flex { display: flex; }
.flex-col { display: flex; flex-direction: column; }
.items-center { align-items: center; }
.justify-between { justify-content: space-between; }
.justify-center { justify-content: center; }
.gap-2 { gap: 0.5rem; } .gap-3 { gap: 0.75rem; } .gap-4 { gap: 1rem; }
.grid { display: grid; }
.grid-cols-2 { grid-template-columns: repeat(2, 1fr); }
.grid-cols-3 { grid-template-columns: repeat(3, 1fr); }
.grid-cols-4 { grid-template-columns: repeat(4, 1fr); }
.text-center { text-align: center; } .text-right { text-align: right; }
.mt-3 { margin-top: 0.75rem; } .mt-4 { margin-top: 1rem; } .mt-5 { margin-top: 1.5rem; }
.mb-2 { margin-bottom: 0.5rem; } .mb-4 { margin-bottom: 1rem; } .mb-5 { margin-bottom: 1.5rem; }
.p-4 { padding: 1rem; } .w-full { width: 100%; }

.surface {
  background: var(--surface);
  backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
  border: 1px solid var(--border); border-radius: 16px;
  box-shadow: 0 8px 32px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.05);
  transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.4s ease;
  overflow: hidden;
}
.surface:hover { box-shadow: 0 12px 48px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.1); }

input, select, textarea {
  background: rgba(0,0,0,0.4); border: 1px solid var(--border); border-radius: 10px;
  color: var(--text); padding: 0.75rem 1rem; font-family: inherit; font-size: 0.95rem;
  outline: none; width: 100%; transition: all 0.3s ease; backdrop-filter: blur(8px);
}
input:focus, select:focus, textarea:focus {
  border-color: var(--accent); box-shadow: 0 0 0 4px rgba(16, 185, 129, 0.2);
  background: rgba(0,0,0,0.6);
}
label span { display: block; font-size: 0.85rem; color: var(--text-muted); margin-bottom: 0.5rem; font-weight: 500; }

button {
  cursor: pointer; font-family: inherit; border: none; border-radius: 10px;
  padding: 0.75rem 1.5rem; font-weight: 600; font-size: 0.95rem;
  transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
}
.btn-primary { 
  background: linear-gradient(135deg, #10b981, #059669); 
  color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,0.2);
  box-shadow: 0 4px 15px var(--accent-glow); 
}
.btn-primary:hover { transform: translateY(-2px) scale(1.02); box-shadow: 0 8px 25px var(--accent-glow); }
.btn-primary:active { transform: translateY(0) scale(0.98); }
.btn-outline { background: rgba(255,255,255,0.02); border: 1px solid var(--border); color: var(--text); backdrop-filter: blur(4px); }
.btn-outline:hover { border-color: var(--accent); color: var(--accent); background: rgba(16, 185, 129, 0.1); transform: translateY(-1px); }

.tab-list { display: flex; gap: 0.75rem; margin-bottom: 2rem; flex-wrap: wrap; }
.tab {
  flex: 1; min-width: 120px; background: rgba(0,0,0,0.4); border: 1px solid var(--border);
  color: var(--text-muted); padding: 1rem; border-radius: 12px; font-weight: 600;
  backdrop-filter: blur(10px); transition: all 0.3s ease;
}
.tab:hover { background: rgba(255,255,255,0.08); color: var(--text); transform: translateY(-2px); }
.tab[aria-selected="true"] {
  background: linear-gradient(135deg, rgba(16, 185, 129, 0.2), rgba(16, 185, 129, 0.05)); 
  border-color: var(--accent); color: var(--accent);
  box-shadow: 0 4px 20px rgba(16, 185, 129, 0.15);
}

.badge {
  display: inline-block; padding: 0.25rem 0.6rem; border-radius: 6px;
  font-size: 0.75rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px;
}
.badge-ai { background: rgba(16, 185, 129, 0.15); color: var(--accent); border: 1px solid var(--accent); }
.badge-org { background: rgba(245, 158, 11, 0.15); color: var(--warning); border: 1px solid var(--warning); }

.risk-low { color: var(--accent); border-color: var(--accent); }
.risk-medium { color: var(--warning); border-color: var(--warning); }
.risk-high { color: #f97316; border-color: #f97316; }
.risk-critical { color: var(--danger); border-color: var(--danger); }
.risk-card {
  background: rgba(0,0,0,0.4); border: 1px solid var(--border); border-radius: 12px; padding: 1.5rem;
  transition: transform 0.3s ease, box-shadow 0.3s ease;
}
.risk-card:hover { transform: translateY(-4px); box-shadow: 0 10px 25px rgba(0,0,0,0.4); }
.risk-card.risk-low { border-left: 5px solid var(--accent); }
.risk-card.risk-medium { border-left: 5px solid var(--warning); }
.risk-card.risk-high { border-left: 5px solid #f97316; }
.risk-card.risk-critical { border-left: 5px solid var(--danger); }

input[type=range] { -webkit-appearance: none; background: transparent; padding: 0; border: none; height: 8px; }
input[type=range]::-webkit-slider-runnable-track { width: 100%; height: 8px; background: rgba(255,255,255,0.1); border-radius: 4px; }
input[type=range]::-webkit-slider-thumb {
  -webkit-appearance: none; height: 20px; width: 20px; border-radius: 50%;
  background: var(--accent); margin-top: -6px; cursor: pointer; box-shadow: 0 0 15px var(--accent-glow);
}

.chat-area {
  height: 380px; overflow-y: auto; background: rgba(0,0,0,0.4); border: 1px solid var(--border);
  border-radius: 16px; padding: 1.5rem; margin-top: 1rem;
}
.chat-area::-webkit-scrollbar { width: 8px; }
.chat-area::-webkit-scrollbar-track { background: rgba(0,0,0,0.2); }
.chat-area::-webkit-scrollbar-thumb { background: #4b5563; border-radius: 4px; }
.chat-bubble {
  max-width: 80%; padding: 1rem 1.25rem; border-radius: 16px; margin-bottom: 1rem;
  font-size: 0.95rem; line-height: 1.5; animation: fadeIn 0.4s ease;
}
.chat-user {
  background: linear-gradient(135deg, rgba(16, 185, 129, 0.2), rgba(16, 185, 129, 0.1)); 
  border: 1px solid rgba(16, 185, 129, 0.3);
  color: #fff; margin-left: auto; border-bottom-right-radius: 4px;
}
.chat-bot {
  background: rgba(255,255,255,0.05); border: 1px solid var(--border);
  margin-right: auto; border-bottom-left-radius: 4px;
}

.panel-header { display: flex; flex-direction: column; gap: 1rem; margin-bottom: 1.5rem; }
@media(min-width: 768px) { .panel-header { flex-direction: row; align-items: flex-end; justify-content: space-between; } }
.text-area-box { background: rgba(0,0,0,0.3); border: 1px solid var(--border); border-radius: 12px; padding: 1.5rem; font-size: 0.95rem; white-space: pre-wrap; line-height: 1.6; }

@keyframes fadeIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
@keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
.tab-panel { animation: slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }

@keyframes spin { to { transform: rotate(360deg); } }
.spinner {
  width: 28px; height: 28px; border: 3px solid rgba(255,255,255,0.1);
  border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s cubic-bezier(0.4, 0, 0.2, 1) infinite;
}

.overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.8); backdrop-filter: blur(8px);
  z-index: 100; display: flex; align-items: center; justify-content: center;
}
.toast {
  position: fixed; bottom: 20px; right: 20px; background: rgba(239, 68, 68, 0.15);
  border: 1px solid var(--danger); color: #fecaca; padding: 1rem 1.5rem; border-radius: 12px;
  z-index: 200; box-shadow: 0 10px 25px rgba(239, 68, 68, 0.2); animation: fadeIn 0.4s ease;
}

.context-section-title {
  color: var(--text); font-size: 1.15rem; font-weight: 600; margin-bottom: 1.2rem; display: flex; align-items: center; gap: 0.75rem;
}
.context-section-title::before { content: ""; width: 4px; height: 20px; background: var(--accent); border-radius: 2px; }

.priority-card {
  background: rgba(0,0,0,0.4); border: 1px solid var(--border); border-radius: 12px; padding: 1.5rem; position: relative; overflow: hidden;
  transition: transform 0.3s ease;
}
.priority-card:hover { transform: translateY(-4px); }
.priority-card::before { content: ""; position: absolute; top: 0; left: 0; width: 5px; height: 100%; background: linear-gradient(180deg, var(--accent), #3b82f6); }
.priority-number { position: absolute; top: -15px; right: 10px; font-size: 5rem; font-weight: 800; color: rgba(255,255,255,0.03); z-index: 0; }

@media (prefers-reduced-motion: reduce) {
  * { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; scroll-behavior: auto !important; }
}

/* Custom Pointer & BG Icons */
body {
  cursor: none;
}
a, button, select, input, .tab, .gate-toggle {
  cursor: none !important;
}

#cursor-dot {
  position: fixed;
  top: 0; left: 0;
  width: 8px; height: 8px;
  background: var(--accent);
  border-radius: 50%;
  pointer-events: none;
  z-index: 9999;
  transform: translate(-50%, -50%);
  box-shadow: 0 0 10px var(--accent-glow);
}

#cursor-ring {
  position: fixed;
  top: 0; left: 0;
  width: 36px; height: 36px;
  border: 2px solid rgba(16, 185, 129, 0.5);
  border-radius: 50%;
  pointer-events: none;
  z-index: 9998;
  transform: translate(-50%, -50%);
  transition: width 0.2s, height 0.2s, background 0.2s;
}

.cursor-hover #cursor-ring {
  width: 50px; height: 50px;
  background: rgba(16, 185, 129, 0.1);
  border-color: rgba(16, 185, 129, 0.8);
}

.bg-icons {
  position: fixed;
  inset: 0;
  z-index: -1;
  pointer-events: none;
  overflow: hidden;
}
.bg-icon {
  position: absolute;
  fill: rgba(255,255,255,0.03);
  animation: floatIcon 20s infinite ease-in-out alternate;
}
@keyframes floatIcon {
  0% { transform: translateY(0) rotate(0deg) scale(1); }
  100% { transform: translateY(-30px) rotate(15deg) scale(1.05); }
}


/* Accessibility */
*:focus-visible {
  outline: 2px solid #00bfff !important;
  outline-offset: 2px !important;
}
.surface {
  background: rgba(0, 0, 0, 0.75) !important;
}

.skip-link { position: absolute; left: -9999px; }
.skip-link:focus { left: 8px; top: 8px; z-index: 999; background: #000; color: #fff; padding: 8px; }
</style>

</head>
<body>
    <a href="#panel-navigate" class="skip-link">Skip to main content</a>

  <div id="cursor-dot"></div>
  <div id="cursor-ring"></div>

  <div class="bg-icons">
    <!-- Soccer Ball -->
    <svg class="bg-icon" style="top: 10%; left: 5%; width: 300px;" viewBox="0 0 512 512"><path d="M256 0C114.6 0 0 114.6 0 256s114.6 256 256 256s256-114.6 256-256S397.4 0 256 0zM140.7 77.21c25.4-15.02 52.61-26.4 81.33-33.15l-19.49 71.9l-61.84 53.07zM256 168.9l51.52-16.14l41.01 44.18l-15.65 58.46H179.1l-15.65-58.46l41.01-44.18zm84.44-58.54l-19.49-71.9c28.72 6.74 55.93 18.13 81.33 33.15zM61.42 165.7c15.22-31.54 36.65-59.5 62.88-81.82l10.97 73.83L80.64 213.3zm21.37 101.9c-2.43 14.53-4.04 29.35-4.04 44.5c0 30.68 5.76 60.1 16.03 87.61L63.59 344.2zm64.44 140.3c27.17 21 60.59 35.83 96.65 41.52l4.98-72.15l-51.4-44.1l-50.23 60.6zM321.3 405.3l-50.23-60.6l-51.4 44.1l4.98 72.15c36.06-5.69 69.47-20.52 96.65-41.52zM362.4 295.6l-47.58 37.66l22.25 61.26c-13.88 12.63-29.28 23.36-45.92 31.95L309.7 357l-53.7-16.8l-53.7 16.8l18.52 69.48c-16.64-8.58-32.05-19.31-45.92-31.95l22.25-61.26l-47.58-37.66C153 282 153.9 269 156 256h199.1c2.1 13 3 26 3 39.6zM450.6 344.2l-31.19 55.45c-20.89 27.67-47.78 50.81-79.06 67.28l10.97-73.83zM431.4 213.3l-54.63-55.53l10.97-73.83c26.23 22.31 47.66 50.28 62.88 81.82zM450.6 167.8l-31.19 55.45c10.27 27.5 16.03 56.92 16.03 87.6c0 15.15-1.61 29.96-4.04 44.5z"/></svg>

  </div>

  <div id="loadingOverlay" class="overlay hidden" aria-live="polite" aria-label="Loading">
    <div class="surface flex items-center gap-3 p-4">
      <div class="spinner" aria-hidden="true"></div>
      <span style="font-weight: 600; font-size: 1.1rem;">Processing...</span>
    </div>
  </div>

  <div id="toast" class="toast hidden" role="alert"></div>

  <main class="container">
    <header>
      <div>
        <h1>⚽ StadiumIQ</h1>
        <p>Operational Intelligence Platform • FIFA World Cup 2026</p>
      </div>
      <div style="text-align: right;">
        <span class="badge badge-ai">Live Systems Nominal</span>
      </div>
    </header>

    <section class="surface mb-5" aria-label="Context Settings">
      <button id="contextToggle" class="w-full flex justify-between items-center p-4" style="background: transparent; border: none; color: white; font-size: 1.1rem;" type="button" aria-expanded="true">
        <span style="font-weight: 600;">Live Context Panel</span>
        <span id="contextChevron" aria-hidden="true" style="font-size: 1.5rem; color: var(--accent);">▾</span>
      </button>
      <div id="contextPanel" style="border-top: 1px solid var(--border); padding: 1.5rem;">
        <div class="grid gap-4">
          <div class="grid grid-cols-3 gap-3">
            <label>
              <span>Time</span>
              <input aria-label="Select Time" id="ctxTime" type="time" value="19:45">
            </label>
            <label>
              <span>Match Phase</span>
              <select id="ctxPhase" aria-label="Select Match Phase">
                <option value="pre_match">Pre-Match</option>
                <option value="first_half">First Half</option>
                <option value="halftime" selected>Halftime</option>
                <option value="second_half">Second Half</option>
                <option value="post_match">Post-Match</option>
              </select>
            </label>
            <label>
              <span>Weather</span>
              <select id="ctxWeather" aria-label="Select Weather">
                <option value="clear" selected>Clear</option>
                <option value="rainy">Rainy</option>
                <option value="humid">Humid</option>
              </select>
            </label>
          </div>

          <div class="mt-4">
            <h3 class="context-section-title">Gate Status</h3>
            <div id="gateToggles" class="grid grid-cols-4 gap-2"></div>
          </div>

          <div class="mt-4">
            <h3 class="context-section-title">Section Occupancy</h3>
            <div id="sectionSliders" class="grid grid-cols-3 gap-4"></div>
          </div>

          <div class="mt-4 grid grid-cols-2 gap-4">
            <label>
              <span>Food Court A Queue (mins)</span>
              <input aria-label="Queue Time Food Court A" id="queueFoodA" type="number" min="0" value="25">
            </label>
            <label>
              <span>Food Court B Queue (mins)</span>
              <input aria-label="Queue Time Food Court B" id="queueFoodB" type="number" min="0" value="5">
            </label>
          </div>

          <div class="mt-4" style="text-align: right;">
            <button id="updateContext" class="btn-primary" type="button">Update Context Engine</button>
          </div>
        </div>
      </div>
    </section>

    <nav class="tab-list" role="tablist">
      <button class="tab" id="tab-navigate" role="tab" aria-selected="true" data-tab="navigate">📍 SmartNav</button>
      <button class="tab" id="tab-crowd" role="tab" aria-selected="false" data-tab="crowd">👥 CrowdPulse</button>
      <button class="tab" id="tab-fan" role="tab" aria-selected="false" data-tab="fan">🤖 FanAssist</button>
      <button class="tab" id="tab-scenario" role="tab" aria-selected="false" data-tab="scenario">⚡ ScenarioSim <span class="badge badge-org" style="margin-left:5px;">Org</span></button>
      <button class="tab" id="tab-copilot" role="tab" aria-selected="false" data-tab="copilot">🧠 Copilot <span class="badge badge-ai" style="margin-left:5px;">AI</span></button>
      <button class="tab" id="tab-sustainability" role="tab" aria-selected="false" data-tab="sustainability">🌱 Sustainability</button>
    </nav>

    <section aria-label="Navigation Panel" id="panel-navigate" class="tab-panel surface p-4" role="tabpanel">
      <div class="grid grid-cols-4 gap-4 items-center">
        <label>
          <span>From</span>
          <select id="navFrom" aria-label="Navigate From"></select>
        </label>
        <label>
          <span>To</span>
          <select id="navTo" aria-label="Navigate To"></select>
        </label>
        <label>
          <span>Language</span>
          <select id="navLanguage" aria-label="Select Navigation Language"></select>
        </label>
        <div style="align-self: flex-end;">
          <button id="navigateButton" class="btn-primary w-full" type="button">Compute Path</button>
        </div>
      </div>
      <div id="navResult" class="mt-5 hidden" role="alert" aria-live="polite">
        <div id="gateWarning" class="hidden mb-4 p-4" style="background: rgba(255,170,0,0.1); border: 1px solid var(--warning); color: var(--warning); border-radius: 8px;"></div>
        <div id="breadcrumb" class="flex gap-2" style="flex-wrap: wrap; margin-bottom: 1rem;"></div>
        <div id="directions" class="text-area-box"></div>
      </div>
    </section>

    <section aria-label="Crowd Pulse Panel" id="panel-crowd" class="tab-panel surface hidden p-4" role="tabpanel">
      <div class="panel-header">
        <label style="width: 200px;">
          <span>Report Language</span>
          <select id="crowdLanguage" aria-label="Select Crowd Analysis Language"></select>
        </label>
        <button id="crowdButton" class="btn-primary" type="button">Run Risk Analysis</button>
      </div>
      <div id="sectionGrid" class="grid grid-cols-3 gap-4"></div>
      <h3 class="context-section-title mt-5">Concourse Pressure</h3>
      <div id="chokePressure" class="grid grid-cols-2 gap-4"></div>
      <div id="crowdExplanation" class="text-area-box mt-5 hidden"></div>
    </section>

    <section aria-label="Fan Assist Panel" id="panel-fan" class="tab-panel surface hidden p-4" role="tabpanel">
      <div class="grid grid-cols-3 gap-4">
        <label>
          <span>Language</span>
          <select id="fanLanguage" aria-label="Select Fan Assist Language"></select>
        </label>
        <label>
          <span>User Location (Optional)</span>
          <input aria-label="User Location" id="fanLocation" type="text" placeholder="e.g. gate_a">
        </label>
        <label>
          <span>Accessibility Needs</span>
          <input aria-label="Accessibility Needs" id="fanAccessibility" type="text" placeholder="e.g. wheelchair access">
        </label>
      </div>
      <div id="chatArea" class="chat-area" aria-live="polite"></div>
      <div class="flex gap-2 mt-4">
        <input aria-label="Enter your question" id="fanInput" type="text" placeholder="Ask FanAssist about queues, gates, or transport..." style="flex: 1;">
        <button id="fanSend" class="btn-primary" type="button">Send</button>
      </div>
    </section>

    <section aria-label="Scenario Simulator Panel" id="panel-scenario" class="tab-panel surface hidden p-4" role="tabpanel">
      <div class="grid grid-cols-4 gap-4 items-center">
        <label>
          <span>Scenario Type</span>
          <select id="scenarioType" aria-label="Select Scenario Type">
            <option value="gate_closure">Gate Closure</option>
            <option value="section_overflow">Section Overflow</option>
            <option value="emergency_evacuation">Emergency Evacuation</option>
          </select>
        </label>
        <label id="scenarioGateWrap">
          <span>Target Gate</span>
          <select id="scenarioGate" aria-label="Select Scenario Target Gate">
            <option value="A">Gate A</option>
            <option value="B">Gate B</option>
            <option value="C">Gate C</option>
            <option value="D">Gate D</option>
          </select>
        </label>
        <label id="scenarioSectionWrap" class="hidden">
          <span>Target Section</span>
          <select id="scenarioSection" aria-label="Select Scenario Target Section"></select>
        </label>
        <label>
          <span>Language</span>
          <select id="scenarioLanguage" aria-label="Select Scenario Language"></select>
        </label>
        <div style="align-self: flex-end;">
          <button id="scenarioButton" class="btn-primary w-full" type="button">Run Simulation</button>
        </div>
      </div>
      <div id="scenarioResult" class="mt-5 hidden" role="alert" aria-live="polite" style="background: rgba(0,0,0,0.3); border: 1px solid var(--border); border-radius: 12px; padding: 1.5rem;"></div>
    </section>

    <section aria-label="Copilot Panel" id="panel-copilot" class="tab-panel surface hidden p-4" role="tabpanel">
      <div class="panel-header">
        <label style="width: 200px;">
          <span>Language</span>
          <select id="copilotLanguage" aria-label="Select Copilot Language"></select>
        </label>
        <button id="copilotButton" class="btn-primary" type="button" style="background: linear-gradient(90deg, #00d4aa, #0099ff); color: #fff; border: none;">Generate Action Plan</button>
      </div>
      <div id="copilotResult" class="hidden mt-4" role="alert" aria-live="polite"></div>
    </section>

    <section aria-label="Sustainability Panel" id="panel-sustainability" class="tab-panel surface hidden p-4" role="tabpanel">
      <div class="panel-header">
        <label style="width: 200px;">
          <span>Language</span>
          <select id="sustainabilityLanguage" aria-label="Select Sustainability Language"></select>
        </label>
        <button id="sustainabilityButton" class="btn-primary" type="button" style="background: linear-gradient(90deg, #4caf50, #81c784); color: #000; border: none;">Get Eco-Friendly Travel Tip</button>
      </div>
      <div id="sustainabilityResult" class="hidden mt-4 text-area-box" role="alert" aria-live="polite"></div>
    </section>
  </main>

  <script>
    
    // Custom Cursor Logic
    const cursorDot = document.getElementById("cursor-dot");
    const cursorRing = document.getElementById("cursor-ring");
    let mouseX = window.innerWidth / 2, mouseY = window.innerHeight / 2;
    let ringX = mouseX, ringY = mouseY;

    window.addEventListener("mousemove", (e) => {
      mouseX = e.clientX;
      mouseY = e.clientY;
      cursorDot.style.left = `${mouseX}px`;
      cursorDot.style.top = `${mouseY}px`;
    });

    function animateCursor() {
      ringX += (mouseX - ringX) * 0.15;
      ringY += (mouseY - ringY) * 0.15;
      cursorRing.style.left = `${ringX}px`;
      cursorRing.style.top = `${ringY}px`;
      requestAnimationFrame(animateCursor);
    }
    animateCursor();

    const interactables = document.querySelectorAll("a, button, input, select, .tab, .gate-toggle");
    interactables.forEach(el => {
      el.addEventListener("mouseenter", () => document.body.classList.add("cursor-hover"));
      el.addEventListener("mouseleave", () => document.body.classList.remove("cursor-hover"));
    });

    const API_BASE = "https://stadium-iq-rho.vercel.app";
    const sections = ["A1", "A2", "B1", "B2", "C1", "C2"];
    const languages = ["English", "Hindi", "Spanish"];
    const gateState = { A: "open", B: "open", C: "closed", D: "open" };
    const defaultOccupancy = { A1: 85, A2: 40, B1: 92, B2: 55, C1: 70, C2: 30 };
    let stadiumMap = null;

    const $ = (id) => document.getElementById(id);

    function setLoading(isLoading) {
      const el = $("loadingOverlay");
      if (isLoading) { el.classList.remove("hidden"); } else { el.classList.add("hidden"); }
    }

    function showToast(message) {
      const toast = $("toast");
      toast.textContent = message;
      toast.classList.remove("hidden");
      window.clearTimeout(showToast.timer);
      showToast.timer = window.setTimeout(() => toast.classList.add("hidden"), 4000);
    }

    async function apiFetch(path, options = {}) {
      setLoading(true);
      try {
        const response = await fetch(`${API_BASE}${path}`, {
          headers: { "Content-Type": "application/json" },
          ...options,
        });
        if (!response.ok) {
          const errorText = await response.text();
          throw new Error(errorText || `Request failed: ${response.status}`);
        }
        return response.json();
      } catch (error) {
        showToast(error.message || "API request failed");
        throw error;
      } finally {
        setLoading(false);
      }
    }

    function populateLanguages() {
      ["navLanguage", "crowdLanguage", "fanLanguage", "scenarioLanguage", "copilotLanguage", "sustainabilityLanguage"].forEach((id) => {
        $(id).innerHTML = languages.map((l) => `<option value="${l}">${l}</option>`).join("");
        $(id).addEventListener("change", (e) => {
          let langCode = "en";
          if (e.target.value === "Spanish") langCode = "es";
          else if (e.target.value === "Hindi") langCode = "hi";
          document.documentElement.lang = langCode;
        });
      });
    }

    function riskClass(val) {
      if (typeof val === "string") {
        return { low: "risk-low", medium: "risk-medium", high: "risk-high", critical: "risk-critical" }[val.toLowerCase()] || "risk-low";
      }
      if (val < 40) return "risk-low";
      if (val < 65) return "risk-medium";
      if (val < 80) return "risk-high";
      return "risk-critical";
    }

    function renderGateToggles() {
      $("gateToggles").innerHTML = Object.keys(gateState).map((gate) => {
        const isOpen = gateState[gate] === "open";
        return `
          <button type="button" data-gate="${gate}" class="gate-toggle btn-outline" style="border-color: ${isOpen ? 'var(--accent)' : 'var(--danger)'}; color: ${isOpen ? 'var(--accent)' : 'var(--danger)'};">
            Gate ${gate}: ${isOpen ? 'OPEN' : 'CLOSED'}
          </button>
        `;
      }).join("");

      document.querySelectorAll(".gate-toggle").forEach((btn) => {
        btn.addEventListener("click", () => {
          const g = btn.dataset.gate;
          gateState[g] = gateState[g] === "open" ? "closed" : "open";
          renderGateToggles();
        });
      });
    }

    function renderSectionSliders() {
      $("sectionSliders").innerHTML = sections.map((sec) => {
        const val = defaultOccupancy[sec];
        const rc = riskClass(val);
        return `
          <div style="background: rgba(0,0,0,0.4); border: 1px solid var(--border); border-radius: 8px; padding: 1rem;">
            <div class="flex justify-between items-center mb-2">
              <span id="label-${sec}" class="${rc}" style="font-weight:700;">Section ${sec}</span>
              <span id="value-${sec}" style="font-weight:600;">${val}%</span>
            </div>
            <input id="section-${sec}" type="range" min="0" max="100" value="${val}">
          </div>
        `;
      }).join("");

      sections.forEach((sec) => {
        $(`section-${sec}`).addEventListener("input", (e) => {
          const val = Number(e.target.value);
          $(`value-${sec}`).textContent = `${val}%`;
          $(`label-${sec}`).className = riskClass(val);
        });
      });
    }

    function getContext() {
      const occ = {};
      sections.forEach(s => { occ[s] = Number($(`section-${s}`).value); });
      return {
        current_time: $("ctxTime").value || "19:45",
        match_phase: $("ctxPhase").value,
        gate_status: { ...gateState },
        weather: $("ctxWeather").value,
        queue_times: {
          food_court_a: Number($("queueFoodA").value || 0),
          food_court_b: Number($("queueFoodB").value || 0),
          restroom_north: 3,
        },
        section_occupancy: occ,
        nearby_transport: { metro: "available", rideshare: "15min_wait", parking_north: "full", parking_south: "available" }
      };
    }

    function fillLocationDropdowns(map) {
      const opts = Object.entries(map.nodes).map(([id, node]) => `<option value="${id}">${node.name}</option>`).join("");
      $("navFrom").innerHTML = opts; $("navTo").innerHTML = opts;
      $("navFrom").value = "gate_a"; $("navTo").value = "section_b1";
      $("scenarioSection").innerHTML = sections.map(s => `<option value="${s}">${s}</option>`).join("");
    }

    function switchTab(tabId) {
      document.querySelectorAll(".tab").forEach(t => {
        const active = t.dataset.tab === tabId;
        t.setAttribute("aria-selected", String(active));
      });
      document.querySelectorAll(".tab-panel").forEach(p => p.classList.add("hidden"));
      $(`panel-${tabId}`).classList.remove("hidden");
    }

    function initTabs() {
      document.querySelectorAll(".tab").forEach(tab => {
        tab.addEventListener("click", () => switchTab(tab.dataset.tab));
      });
    }

    async function loadMap() {
      stadiumMap = await apiFetch("/stadium-map");
      fillLocationDropdowns(stadiumMap);
    }

    async function navigate() {
      const data = await apiFetch("/navigate", {
        method: "POST", body: JSON.stringify({
          from_location: $("navFrom").value, to_location: $("navTo").value,
          language: $("navLanguage").value, context: getContext()
        })
      });
      $("navResult").classList.remove("hidden");
      const gw = $("gateWarning");
      if (data.gate_warning) { gw.textContent = data.gate_warning; gw.classList.remove("hidden"); } else { gw.classList.add("hidden"); }
      $("breadcrumb").innerHTML = data.path_names.map((n, i) => `
        <span class="badge" style="border: 1px solid var(--accent); color: var(--accent); background: rgba(0,212,170,0.1); padding: 0.4rem 0.8rem;">${n}</span>
        ${i < data.path_names.length - 1 ? '<span style="color:#666;">→</span>' : ""}
      `).join("");
      $("directions").textContent = data.directions || "No directions returned.";
    }

    async function analyzeCrowd() {
      const data = await apiFetch("/crowd", {
        method: "POST", body: JSON.stringify({ language: $("crowdLanguage").value, context: getContext() })
      });
      $("sectionGrid").innerHTML = data.risk_analysis.sections.map(s => `
        <div class="risk-card ${riskClass(s.risk_level)}">
          <div class="flex justify-between items-center mb-2">
            <h3 style="font-size:1.2rem; margin:0;">${s.section_id}</h3>
            <span class="badge" style="border:1px solid currentColor;">${s.risk_level}</span>
          </div>
          <div style="font-size:2rem; font-weight:700; margin-bottom:0.5rem;">${s.occupancy_pct}%</div>
          <p style="color:var(--text-muted); font-size:0.9rem;">${s.suggested_action}</p>
        </div>
      `).join("");
      $("chokePressure").innerHTML = Object.values(data.choke_pressure).map(p => `
        <div class="risk-card ${riskClass(p.pressure_level)}">
          <h3 style="margin-bottom:0.5rem; text-transform:capitalize;">${p.concourse_id.replace("_", " ")}</h3>
          <div style="font-size:2rem; font-weight:700;">${p.pressure_score.toFixed(1)}</div>
          <p style="text-transform:uppercase; font-size:0.8rem; font-weight:600; margin-bottom:0.5rem;" class="${riskClass(p.pressure_level)}">${p.pressure_level}</p>
          <p style="color:var(--text-muted); font-size:0.9rem;">${p.recommendation}</p>
        </div>
      `).join("");
      $("crowdExplanation").textContent = data.ai_explanation;
      $("crowdExplanation").classList.remove("hidden");
    }

    function appendChat(role, msg) {
      const isUser = role === "user";
      const cls = isUser ? "chat-user" : "chat-bot";
      const div = document.createElement("div");
      div.className = `chat-bubble ${cls}`;
      div.textContent = msg;
      $("chatArea").appendChild(div);
      $("chatArea").scrollTop = $("chatArea").scrollHeight;
    }

    async function sendFanMessage() {
      const q = $("fanInput").value.trim();
      if (!q) return;
      appendChat("user", q);
      $("fanInput").value = "";
      const data = await apiFetch("/fan", {
        method: "POST", body: JSON.stringify({
          query: q, language: $("fanLanguage").value, user_location: $("fanLocation").value,
          accessibility_needs: $("fanAccessibility").value, context: getContext()
        })
      });
      appendChat("assistant", data);
    }

    function updateScenarioParams() {
      const t = $("scenarioType").value;
      $("scenarioGateWrap").className = t === "gate_closure" ? "" : "hidden";
      $("scenarioSectionWrap").className = t === "section_overflow" ? "" : "hidden";
    }

    async function simulateScenario() {
      const t = $("scenarioType").value;
      const p = {};
      if (t === "gate_closure") p.gate = $("scenarioGate").value;
      if (t === "section_overflow") p.section = $("scenarioSection").value;
      const data = await apiFetch("/scenario", {
        method: "POST", body: JSON.stringify({ scenario_type: t, scenario_params: p, language: $("scenarioLanguage").value, context: getContext() })
      });
      const imp = data.computed_impact;
      const routes = imp.alternative_routes || {};
      const routesHtml = Object.keys(routes).length ? Object.entries(routes).map(([k,v]) => `<li><b>${k}:</b> ${Array.isArray(v.path_names)?v.path_names.join(" → "):JSON.stringify(v)}</li>`).join("") : "<li>None</li>";
      
      $("scenarioResult").innerHTML = `
        <div class="grid grid-cols-3 gap-4 mb-4">
          <div><p style="color:var(--text-muted); font-size:0.9rem;">Affected Fans</p><p style="font-size:2.5rem; font-weight:700;">${(imp.affected_fans||0).toLocaleString()}</p></div>
          <div><p style="color:var(--text-muted); font-size:0.9rem;">Severity</p><div class="mt-3"><span class="badge ${riskClass(imp.severity)}" style="font-size:0.9rem; padding:0.4rem 1rem;">${imp.severity}</span></div></div>
          <div><p style="color:var(--text-muted); font-size:0.9rem;">Volunteers Req.</p><p style="font-size:2.5rem; font-weight:700;">${imp.required_volunteers}</p></div>
        </div>
        <div class="grid grid-cols-2 gap-4 mt-5">
          <div><h4 style="margin-bottom:0.5rem; color:var(--accent);">Alternate Routes</h4><ul style="padding-left:1.2rem; color:var(--text-muted); font-size:0.9rem;">${routesHtml}</ul></div>
          <div><h4 style="margin-bottom:0.5rem; color:var(--accent);">Affected Amenities</h4><ul style="padding-left:1.2rem; color:var(--text-muted); font-size:0.9rem;">${(imp.affected_amenities||[]).map(a=>`<li>${a}</li>`).join("")||"<li>None</li>"}</ul></div>
        </div>
        <div class="text-area-box mt-5">${data.ai_explanation}</div>
      `;
      $("scenarioResult").classList.remove("hidden");
    }

    async function runCopilot() {
      const data = await apiFetch("/copilot", {
        method: "POST", body: JSON.stringify({ language: $("copilotLanguage").value, context: getContext() })
      });
      const sum = data.situation_summary;
      const prio = [];
      if(sum.critical_sections.length) prio.push({t: "Stabilize Critical Sections", a: `Restrict entry and redirect traffic away from ${sum.critical_sections.join(", ")}.`, o: "Crowd safety supervisor"});
      if(sum.high_risk_sections.length) prio.push({t: "Guide High Risk Areas", a: `Deploy volunteers near ${sum.high_risk_sections.join(", ")}.`, o: "Volunteer coordinator"});
      if(sum.overloaded_queues.length) prio.push({t: "Reduce Queue Pressure", a: `Divert fans from ${sum.overloaded_queues.join(", ")}.`, o: "Concessions manager"});
      if(sum.closed_gates.length) prio.push({t: "Manage Closed Gates", a: `Broadcast alternate entry guidance for Gate ${sum.closed_gates.join(", ")}.`, o: "Gate operations lead"});
      while(prio.length < 3) prio.push({t: "Maintain Monitoring", a: "Continue scanning occupancy, gates, queues, and concourse pressure.", o: "Operations desk"});
      
      const cards = prio.slice(0,3).map((p, i) => `
        <div class="priority-card">
          <div class="priority-number">${i+1}</div>
          <h3 style="margin-bottom:0.8rem; font-size:1.1rem; position:relative; z-index:1;">${p.t}</h3>
          <p style="font-size:0.9rem; color:var(--text-muted); margin-bottom:0.5rem; position:relative; z-index:1;"><b>Action:</b> ${p.a}</p>
          <p style="font-size:0.9rem; color:var(--text-muted); position:relative; z-index:1;"><b>Who:</b> <span style="color:var(--text);">${p.o}</span></p>
        </div>
      `).join("");
      
      $("copilotResult").innerHTML = `
        <div class="flex justify-between items-center mb-4">
          <span class="badge ${riskClass(data.overall_risk)}" style="padding:0.4rem 1rem;">Overall Risk: ${data.overall_risk}</span>
          <span style="color:var(--text-muted); font-size:0.9rem;">${data.timestamp}</span>
        </div>
        <div class="grid grid-cols-3 gap-4">${cards}</div>
        <div class="text-area-box mt-5">${data.top_priorities_explanation}</div>
      `;
      $("copilotResult").classList.remove("hidden");
    }

    async function runSustainability() {
      const data = await apiFetch("/sustainability", {
        method: "POST", body: JSON.stringify({ language: $("sustainabilityLanguage").value, context: getContext() })
      });
      $("sustainabilityResult").textContent = data.eco_tip;
      $("sustainabilityResult").classList.remove("hidden");
    }

    function initEvents() {
      $("contextToggle").addEventListener("click", () => {
        const p = $("contextPanel");
        const hidden = p.style.display === "none";
        p.style.display = hidden ? "block" : "none";
        $("contextChevron").textContent = hidden ? "▾" : "▸";
      });
      $("updateContext").addEventListener("click", () => showToast("Context updated for AI Agents"));
      $("navigateButton").addEventListener("click", () => navigate().catch(()=>{}));
      $("crowdButton").addEventListener("click", () => analyzeCrowd().catch(()=>{}));
      $("fanSend").addEventListener("click", () => sendFanMessage().catch(()=>{}));
      $("fanInput").addEventListener("keydown", (e) => { if(e.key==="Enter") sendFanMessage().catch(()=>{}); });
      $("scenarioType").addEventListener("change", updateScenarioParams);
      $("scenarioButton").addEventListener("click", () => simulateScenario().catch(()=>{}));
      $("copilotButton").addEventListener("click", () => runCopilot().catch(()=>{}));
      $("sustainabilityButton").addEventListener("click", () => runSustainability().catch(()=>{}));
    }

    async function init() {
      populateLanguages();
      renderGateToggles();
      renderSectionSliders();
      initTabs();
      initEvents();
      updateScenarioParams();
      appendChat("assistant", "Hi, I am FanAssist. Ask about food, gates, routes, accessibility, or transport.");
      await loadMap().catch(()=>{});
    }

    init();
  </script>
</body>
</html>
